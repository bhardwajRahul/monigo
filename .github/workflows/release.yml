# Runs when a version tag is pushed.
#
# Publishing a release used to be four manual steps, and the one that mattered
# was easy to skip: stamping CHANGELOG.md. A tag pushed without it produces a
# release with no notes, a docs site that silently shows nothing new, and a
# tagged tree whose own changelog is missing its own entry. Nothing caught it.
#
# The stamping stays a reviewed pull request -- that is where judgement about
# what shipped belongs. Everything after it is automated here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the changelog
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # The newest stamped release, ignoring [Unreleased].
          NEWEST="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                    | head -1 | sed -E 's/^## \[(.*)\]/\1/')"

          if [ "$VERSION" != "$NEWEST" ]; then
            echo "::error::Tag $TAG does not match the newest stamped release in CHANGELOG.md (found [$NEWEST])."
            echo "::error::Stamp the release first — move the [Unreleased] entries under ## [$VERSION] — then re-tag."
            exit 1
          fi

          # Everything between this version's heading and the next one.
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## \[/   { exit }
            inside               { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has a heading for $VERSION but no body under it."
            exit 1
          fi

          {
            echo ""
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          } >> /tmp/notes.md

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release notes: $(wc -l < /tmp/notes.md) lines"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi

      # Optional. The docs site rebuilds on its own daily schedule, so this only
      # shortens the delay; it is skipped cleanly when the secret is absent
      # rather than failing the release.
      - name: Ask the docs site to rebuild
        env:
          SITE_TOKEN: ${{ secrets.SITE_REBUILD_TOKEN }}
        run: |
          if [ -z "${SITE_TOKEN:-}" ]; then
            echo "SITE_REBUILD_TOKEN not set — skipping. The site picks this up on its daily rebuild."
            exit 0
          fi
          curl -sfS -X POST \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/iyashjayesh/monigo-website/dispatches \
            -d '{"event_type":"monigo-release"}'
          echo "Dispatched monigo-release to the docs site."
