<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoniGo — Exporters</title>
    <link rel="icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="./css/monigo-design.css">
    <link rel="stylesheet" href="./css/monigo-styles.css">
</head>

<body class="mg" data-theme="light">

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4M12 17h.01"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M21.8 10A10 10 0 1 1 17 3.34M9 11l3 3L22 4"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></symbol>
    </svg>

<div class="mg-app">
  <nav class="mg-rail">
    <div class="mg-rail__brand">
      <img src="./assets/monigo-icon.png" alt="MoniGo">
      <!-- Filled from /service-info, which reads it from build info. Left empty
           and hidden when the version is not knowable, rather than carrying a
           literal that goes stale. -->
      <span class="mg-version" id="mg-version" hidden></span>
    </div>

    <div class="mg-svc">
      <div class="mg-svc__avatar" id="mg-avatar">--</div>
      <div class="mg-svc__id">
        <span class="mg-svc__name" id="mg-service-name">connecting...</span>
        <span class="mg-svc__meta" id="mg-service-meta"></span>
      </div>
      <span class="mg-dot" id="mg-status-dot" title="Connected"></span>
    </div>

    <div class="mg-navhead">Monitor</div>
    <div class="mg-nav">
      <a href="./index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.8" y="1.8" width="5" height="5" rx="1"></rect><rect x="9.2" y="1.8" width="5" height="5" rx="1"></rect><rect x="1.8" y="9.2" width="5" height="5" rx="1"></rect><rect x="9.2" y="9.2" width="5" height="5" rx="1"></rect></svg>
        <span>Overview</span>
      </a>
      <a href="./function-metrics.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.5 3h-1a1.6 1.6 0 0 0-1.6 1.6v1.7c0 .8-.6 1.4-1.4 1.4.8 0 1.4.6 1.4 1.4v1.7A1.6 1.6 0 0 0 4.5 13h1"></path><path d="M10.5 3h1a1.6 1.6 0 0 1 1.6 1.6v1.7c0 .8.6 1.4 1.4 1.4-.8 0-1.4.6-1.4 1.4v1.7a1.6 1.6 0 0 1-1.6 1.6h-1"></path></svg>
        <span>Functions</span>
        <span class="mg-badge" id="mg-count-functions"></span>
      </a>
      <a href="./go-routines-stats.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.1"></circle><path d="M8 1.4v2.3M8 12.3v2.3M1.4 8h2.3M12.3 8h2.3M3.4 3.4l1.6 1.6M11 11l1.6 1.6M12.6 3.4L11 5M5 11l-1.6 1.6"></path></svg>
        <span>Goroutines</span>
        <span class="mg-badge" id="mg-count-goroutines"></span>
      </a>
      <a href="./reports.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3.2 2.2h6l3.6 3.6v8a.6.6 0 0 1-.6.6H3.2a.6.6 0 0 1-.6-.6V2.8a.6.6 0 0 1 .6-.6z"></path><path d="M9 2.4V6h3.6M5.2 9.4h5.6M5.2 11.6h3.4"></path></svg>
        <span>Reports</span>
      </a>
      <a href="./exporters.html" class="is-active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.8v5.4M8 7.2 4.4 9.6M8 7.2l3.6 2.4"></path><circle cx="8" cy="1.8" r="1.3"></circle><circle cx="4.4" cy="10.4" r="1.3"></circle><circle cx="11.6" cy="10.4" r="1.3"></circle><path d="M2.4 13.6h11.2"></path></svg>
        <span>Exporters</span>
      </a>
    </div>

    <div class="mg-rail__foot">
      <div class="mg-row">
        <span class="mg-rail__footlabel">STORAGE</span>
        <span class="mg-rail__footmode" id="mg-storage-mode"></span>
      </div>
      <div class="mg-rail__footvalue" id="mg-storage-value"></div>
    </div>
  </nav>

  <div class="mg-main">
    <header class="mg-top">
      <button type="button" class="mg-iconbtn mg-top__menu" id="mg-topbar-menu"
              aria-label="Toggle navigation" aria-expanded="false">
        <svg class="mg-icon" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
      <span class="mg-top__title">Exporters</span>
      <span class="mg-top__sub" id="mg-asof"></span>
      <div class="mg-top__right">
        <button type="button" class="mg-iconbtn" id="mg-theme-toggle" title="Toggle theme"
                aria-label="Toggle theme">
          <svg class="mg-icon" aria-hidden="true"><use href="#i-moon" id="mg-theme-icon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Connection state. Filled by common.js when a poll fails; the numbers
         below dim at the same time so they cannot be read as current. -->
    <div id="mg-banner" hidden></div>

    <!-- The leak verdict belongs here as well as on the Goroutines page: it is
         the one thing an operator should not have to go looking for. -->
    <div id="mg-leak" hidden></div>

    <main class="mg-content" id="mg-content">
      <div class="mg-stack">

  <!-- Prometheus is always listed: its collector is registered at package init,
       so the scrape endpoint exists whether or not anything scrapes it. Push
       exporters appear only once configured. -->
  <section class="mg-exp-grid" id="mg-exp-grid"></section>
  <p class="mg-fn-empty" id="mg-exp-empty" hidden></p>

      </div>
    </main>
  </div>
</div>

    <script src="./js/common.js" defer></script>
    <script src="./js/exporters-view.js" defer></script>
</body>

</html>
